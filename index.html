<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>N0tesBugB</title>
<style>
    :root{--bg:#0f1720;--panel:#0b1220;--accent:#06b6d4;--muted:#94a3b8;--card:#0b1226}
    *{box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    body{margin:0;background:linear-gradient(180deg,#071124 0%,#071b2a 100%);color:#e6eef6;min-height:100vh;display:flex;gap:18px;padding:18px}
    .app{display:flex;flex:1;gap:18px}
    .panel{background:rgba(8,15,25,.6);border-radius:10px;padding:12px;min-width:260px;max-width:320px;height:calc(100vh - 36px);overflow:auto;box-shadow:0 6px 18px rgba(2,6,23,.6)}
    header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    header h1{font-size:16px;margin:0;color:var(--accent)}
    .targets{display:flex;flex-direction:column;gap:8px}
    .target-item{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);cursor:pointer}
    .target-item.active{outline:2px solid rgba(6,182,212,.12);background:linear-gradient(90deg,rgba(6,182,212,.04),transparent)}
    .muted{color:var(--muted);font-size:13px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:6px 8px;border-radius:8px;color:var(--accent);cursor:pointer}
    .small{padding:6px 8px;font-size:13px}
    .main{flex:1;display:flex;flex-direction:column;gap:12px;height:calc(100vh - 36px);overflow:auto}
    .toolbar{display:flex;gap:8px;align-items:center}
    .save-status{font-size:13px;color:var(--muted);margin-top:4px}
    button:focus, input:focus, textarea:focus{box-shadow:0 0 0 3px rgba(6,182,212,0.08);outline:none}
    .card{background:rgba(255,255,255,0.02);padding:12px;border-radius:10px;overflow:auto}
    input[type=text], textarea, select{background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit;padding:8px;border-radius:8px;outline:none;width:100%}
    textarea{min-height:90px;resize:vertical}
    .categories{display:flex;gap:8px;flex-wrap:wrap}
    .cat{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,0.02);cursor:pointer}
    .cat.active{background:linear-gradient(90deg,rgba(6,182,212,.12),transparent);border:1px solid rgba(6,182,212,.12)}
    .subcat{padding:6px 8px;border-radius:8px;background:rgba(255,255,255,0.01);cursor:pointer;font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,0.02)}
    .subcat.active{background:rgba(6,182,212,0.06);color:var(--accent);border:1px solid rgba(6,182,212,0.12)}
    .notes-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
    .qq-string{color:#f6c177}
    .notes-list a{color:var(--accent)}
    .note{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;color:#ffffff;font-size:16px}
    .note-title{font-weight:600}
    .note-meta{font-size:16px;color:#ffffff;margin-top:6px}
    .actions{display:flex;gap:6px}
    .danger{color:#ff7b7b;border-color:rgba(255,123,123,0.12)}
    .hidden{display:none}
    footer{font-size:12px;color:var(--muted);padding:8px;text-align:center}
    .confirm-box{position:fixed;right:18px;bottom:18px;background:rgba(6,6,12,0.9);padding:10px 12px;border-radius:8px;box-shadow:0 6px 20px rgba(2,6,23,.6);z-index:9999;display:flex;gap:10px;align-items:center}
    .confirm-box .msg{color:#e6eef6;font-size:13px}
    .confirm-box .actions{display:flex;gap:8px}
    .confirm-box .actions button{padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--accent);cursor:pointer}
    .confirm-box .actions .cancel{color:var(--muted);border-color:rgba(255,255,255,0.03)}
    .toast-wrap{position:fixed;right:18px;top:18px;display:flex;flex-direction:column;gap:8px;z-index:9999}
    .toast{background:rgba(0,0,0,0.6);color:#e6eef6;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);min-width:180px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
    .toast.error{border-color:rgba(255,100,100,0.16)}
    .lang-menu{position:absolute;left:0;bottom:48px;background:rgba(6,6,12,0.9);padding:8px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:6px}
    .lang-menu.hidden{display:none}
    .lang-option{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:6px 8px;border-radius:6px;color:inherit;cursor:pointer;display:flex;gap:8px;align-items:center}
    .lang-option:hover{background:rgba(255,255,255,0.02)}
    @media(max-width:880px){body{flex-direction:column;padding:12px} .panel{max-width:none;width:100%;height:auto} .main{height:auto}}
</style>
</head>

        <footer class="card"></footer>

    // helpers
    function id(){ return 'id_' + Math.random().toString(36).slice(2,9); }
    function formatDate(ts){ const d=new Date(ts); return d.toLocaleString(); }
    // compute total notes for a categories object (used in multiple places)
    function computeNoteCount(categories){
        if (!categories || typeof categories !== 'object') return 0;
        return Object.values(categories).reduce((s,a)=>{
            if (Array.isArray(a)) return s + a.length;
            if (a && typeof a === 'object'){
                let subSum = (a._notes? a._notes.length : 0);
                if (a.sub) subSum += Object.values(a.sub).reduce((ss,arr)=> ss + (Array.isArray(arr)?arr.length:0),0);
                return s + subSum;
            }
            return s;
        },0);
    }

    // translation helper with replacements
    function t(key, vars){ let s = Lkey(key); if (!s) return ''; if (vars){ for (const k in vars){ s = s.replace(new RegExp('\{' + k + '\}', 'g'), vars[k]); } } return s; }
    // language helpers (global)
    let currentLangKey = 'pt';
    function Lkey(k){ return (langs[currentLangKey] && langs[currentLangKey][k]) || (langs.pt && langs.pt[k]) || ''; }

    function applyLanguage(lang){
        const L = langs[lang] || langs.pt;
        currentLangKey = lang || 'pt';

        document.title = L.title;
        const h1 = document.querySelector('aside h1'); if (h1) h1.textContent = L.title;
        // set document language attribute
        try{ document.documentElement.lang = (lang === 'en' ? 'en' : 'pt-BR'); }catch(e){}
        newTargetInput.placeholder = L.addTargetPlaceholder;
        addTargetBtn.textContent = L.addBtn;
        exportBtn.textContent = L.export;
        const importBtnEl = document.getElementById('importBtn'); if (importBtnEl) importBtnEl.textContent = L.import;
        // panel labels
        const tEls = document.querySelectorAll('.muted');
        // update known label elements
        const selectedLabel = document.getElementById('selectedLabel'); if (selectedLabel) selectedLabel.textContent = L.selected || '';
        const categoriesLabel = document.getElementById('categoriesLabel'); if (categoriesLabel) categoriesLabel.textContent = L.categories || '';
        const addCategoryLabel = document.getElementById('addCategoryLabel'); if (addCategoryLabel) addCategoryLabel.textContent = L.addCategory || '';
        const notesLabel = document.getElementById('notesLabel'); if (notesLabel) notesLabel.textContent = L.notes || '';
        const newNoteLabel = document.getElementById('newNoteLabel'); if (newNoteLabel) newNoteLabel.textContent = L.newNote || '';
        const selectedEl = document.getElementById('selectedTargetName'); if (selectedEl){ /* title stays inside area */ }
        addCategoryBtn.textContent = L.addCategory;
        newCategoryInput.placeholder = L.newCategoryPlaceholder;
        const toggleBtn = document.getElementById('toggleNewCatBtn');
        if (toggleBtn) toggleBtn.textContent = L.addCategory || 'Adicionar Categoria';
        addNoteBtn.textContent = L.addNote;
        clearNoteBtn.textContent = L.clear;
        const storageNotice = document.getElementById('storageNotice'); if (storageNotice) storageNotice.textContent = L.storageNotice || '';
        if (noteContent) noteContent.placeholder = L.notePlaceholder || '';
        // footer tip replace
        const footer = document.querySelector('footer.card'); if (footer) footer.textContent = L.footerTip || '';
        const deleteTargetBtnEl = document.getElementById('deleteTargetBtn'); if (deleteTargetBtnEl) deleteTargetBtnEl.textContent = t('deleteTarget') || deleteTargetBtnEl.textContent;
        // update language menu labels
        const langMenuEl = document.getElementById('langMenu');
        if (langMenuEl){
            const optPt = langMenuEl.querySelector('.lang-option[data-lang="pt"]'); if (optPt) optPt.querySelector('span:last-child').textContent = L.langPtLabel || 'Português - Brasil';
            const optEn = langMenuEl.querySelector('.lang-option[data-lang="en"]'); if (optEn) optEn.querySelector('span:last-child').textContent = L.langEnLabel || 'English';
        }
    }
    // show a floating confirmation box (non-native) with message and callbacks
    function showConfirm(message, onYes, onNo){
        // remove existing
        const existing = document.getElementById('_bb_confirm');
        if (existing) existing.remove();
        const box = document.createElement('div');
        box.id = '_bb_confirm';
        box.className = 'confirm-box';
        const msg = document.createElement('div'); msg.className = 'msg'; msg.textContent = message;
        const actions = document.createElement('div'); actions.className = 'actions';
        const btnNo = document.createElement('button'); btnNo.className='cancel'; btnNo.textContent=Lkey('cancel');
        const btnYes = document.createElement('button'); btnYes.textContent=Lkey('confirm');
        btnNo.addEventListener('click', ()=>{ box.remove(); if (typeof onNo==='function') onNo(); });
        btnYes.addEventListener('click', ()=>{ box.remove(); if (typeof onYes==='function') onYes(); });
        actions.appendChild(btnNo); actions.appendChild(btnYes);
        box.appendChild(msg); box.appendChild(actions);
        document.body.appendChild(box);
        // focus confirm for keyboard
        btnYes.focus();
    }
    // small non-blocking toast
    function showToast(message, opts){
        opts = opts || {};
        const wrapId = '_bb_toast_wrap';
        let wrap = document.getElementById(wrapId);
        if (!wrap){ wrap = document.createElement('div'); wrap.id = wrapId; wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
        const t = document.createElement('div'); t.className = 'toast' + (opts.error? ' error' : '');
        t.textContent = message;
        wrap.appendChild(t);
        const timeout = typeof opts.timeout === 'number' ? opts.timeout : 3500;
        setTimeout(()=>{ try{ t.remove(); }catch(e){} }, timeout);
    }

    // autosave / draft helpers
    const DRAFT_KEY = STORAGE_KEY + '_draft';
    let autosaveTimer = null;
    function setSaveStatus(text){ const el = document.getElementById('saveStatus'); if (el) el.textContent = text || ''; }
    function saveDraft(){ try{
        if (!selectedTarget || !selectedCategory || !noteContent) { localStorage.removeItem(DRAFT_KEY); setSaveStatus(''); return; }
        const draft = { target: selectedTarget, category: selectedCategory, sub: selectedSubcategory, content: noteContent.value || '', ts: Date.now() };
        localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
        setSaveStatus(Lkey('saved'));
    }catch(e){ console.error(e); } }

    function scheduleDraftSave(){ clearTimeout(autosaveTimer); setSaveStatus(Lkey('unsaved')); autosaveTimer = setTimeout(()=>{ saveDraft(); }, 900); }

    function loadDraftIfExists(){ try{
        const raw = localStorage.getItem(DRAFT_KEY);
        if (!raw) return;
        const d = JSON.parse(raw);
        if (!d || !d.target) return;
        if (d.target === selectedTarget && d.category === selectedCategory){ if (noteContent && !noteContent.value){ noteContent.value = d.content || ''; setSaveStatus(''); } }

    // convert bare URLs into autolink-safe form: wrap in <> when needed
    function preprocessUrls(text){
        if (!text) return '';
        try{
            return text.replace(/(^|\s)((https?:\/\/|www\.)[^\s<]+)/g, (m,p1,p2)=>{ let url = p2; if (!/^https?:\/\//i.test(url)) url = 'http://' + url; return p1 + '<' + url + '>'; });
        }catch(e){ return text; }
    }

    // wrap quoted strings ("..." or '...') in spans with class for highlighting
    function wrapQuotedStringsInDOM(root){
        if (!root) return;
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        const textNodes = [];
        while(walker.nextNode()) textNodes.push(walker.currentNode);
        textNodes.forEach(tn=>{
            const s = tn.nodeValue;
            if (!s) return;
            const parts = s.split(/(("[^"\\]*(?:\\.[^"\\]*)*"|'[^'\\]*(?:\\.[^'\\]*)*'))/g);
            if (parts.length === 1) return;
            const parent = tn.parentNode;
            parts.forEach(p=>{
                if (!p) return;
                if (/^("[^"\\]*(?:\\.[^"\\]*)*"|'[^'\\]*(?:\\.[^'\\]*)*')$/.test(p)){
                    const span = document.createElement('span'); span.className='qq-string'; span.textContent = p; parent.insertBefore(span, tn);
                } else {
                    parent.insertBefore(document.createTextNode(p), tn);
                }
            });
            parent.removeChild(tn);
        });
    }

    function renderNoteMarkdown(raw){
        try{
            const pre = preprocessUrls(raw || '');
            const md = (window.marked ? marked.parse(pre) : (pre.replace(/</g,'&lt;').replace(/>/g,'&gt;')));
            const clean = (window.DOMPurify ? DOMPurify.sanitize(md, {USE_PROFILES: {html: true}}) : md);
            // parse into DOM to wrap quoted strings and set anchors
            const parser = new DOMParser();
            const doc = parser.parseFromString('<div>' + clean + '</div>','text/html');
            const root = doc.body.firstChild;
            // wrap quoted strings in text nodes
            wrapQuotedStringsInDOM(root);
            // ensure links open in new tab and are safe
            root.querySelectorAll('a').forEach(a=>{ try{ a.setAttribute('target','_blank'); a.setAttribute('rel','noopener noreferrer'); }catch(e){} });
            return root.innerHTML;
        }catch(e){ return (raw||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    }

    // Inline rename for targets (replaces prompt-based flow)
    function startInlineRenameTarget(el, oldName){
        if (!el) return;
        const container = document.createElement('span');
        container.style.display = 'inline-flex';
        container.style.alignItems = 'center';
        container.style.gap = '6px';

        const input = document.createElement('input');
        input.type = 'text';
        input.value = oldName;
        input.style.minWidth = '140px';
        input.style.padding = '4px 8px';
        input.style.borderRadius = '6px';
        input.style.border = '1px solid rgba(255,255,255,0.08)';
        input.style.background = 'transparent';
        input.setAttribute('aria-label', 'Rename target');

        const ok = document.createElement('button'); ok.className='btn small'; ok.textContent='✓'; ok.title='Salvar';
        const cancelBtn = document.createElement('button'); cancelBtn.className='btn small'; cancelBtn.textContent='✖'; cancelBtn.title='Cancelar';

        container.appendChild(input); container.appendChild(ok); container.appendChild(cancelBtn);
        el.replaceWith(container);
        input.focus(); input.select();

        let finished = false;
        function restore(){ try{ container.replaceWith(el); }catch(e){} }
        function doFinish(){ if (finished) return; finished = true; const name = (input.value||'').trim(); if (!name){ restore(); return; } if (name === oldName){ restore(); return; } if (data.targets[name]){ showToast(t('targetExistsRename'), {error:true}); finished = false; input.focus(); return; } data.targets[name] = data.targets[oldName]; delete data.targets[oldName]; if (selectedTarget===oldName) selectedTarget=name; save(); renderTargets(); renderTargetDetails(); }
        function doCancel(){ if (finished) return; finished = true; restore(); }

        ok.addEventListener('click',(e)=>{ e.stopPropagation(); doFinish(); });
        cancelBtn.addEventListener('click',(e)=>{ e.stopPropagation(); doCancel(); });
        input.addEventListener('keydown',(e)=>{ if (e.key==='Enter'){ e.stopPropagation(); doFinish(); } else if (e.key==='Escape'){ e.stopPropagation(); doCancel(); } });
        input.addEventListener('blur', ()=>{ setTimeout(()=>{ if (!finished) doFinish(); }, 150); });
    }

    function addNote(){
        if (!selectedTarget || !selectedCategory) return showToast(t('selectTargetAndCategory'), {error:true});

        if (!content) return showToast(t('writeNote'), {error:true});

        const catVal = data.targets[selectedTarget].categories[selectedCategory];

            // update existing note
            const note = findNoteById(editingNoteId);
            if (!note){ editingNoteId = null; addNoteBtn.textContent = Lkey('addNote'); clearNoteBtn.textContent = Lkey('clear'); return; }
            note.content = content;
            note.ts = Date.now();
            editingNoteId = null;
            addNoteBtn.textContent = Lkey('addNote');
            clearNoteBtn.textContent = Lkey('clear');
        } else {
            const note = { id: id(), content, ts: Date.now() };
            if (Array.isArray(catVal)){
                catVal.push(note);
            } else if (catVal && typeof catVal === 'object'){
                if (selectedSubcategory){
                    if (!catVal.sub) catVal.sub = {};
                    if (!catVal.sub[selectedSubcategory]) catVal.sub[selectedSubcategory] = [];
                    catVal.sub[selectedSubcategory].push(note);
                } else {
                    if (!catVal._notes) catVal._notes = [];
                    catVal._notes.push(note);
                }
            } else {
                // safety: create as array
                data.targets[selectedTarget].categories[selectedCategory] = [note];
            }
        }
        // recalc noteCount (using helper)
        data.targets[selectedTarget].noteCount = computeNoteCount(data.targets[selectedTarget].categories);
        save();
        try{ localStorage.removeItem(DRAFT_KEY); setSaveStatus(''); }catch(e){}
        noteContent.value=''; renderNotes(); renderTargets();
    }

    // view/edit removed: notes are shown inline and edited via delete + re-add if needed

    function deleteNote(id){
        const catVal = data.targets[selectedTarget].categories[selectedCategory];
        let catNotes = null;
        if (Array.isArray(catVal)) catNotes = catVal;
        else if (catVal && typeof catVal === 'object'){
            if (selectedSubcategory) catNotes = (catVal.sub && catVal.sub[selectedSubcategory]) || null;
            else catNotes = catVal._notes || null;
        }
        if (!catNotes) return;
        const idx = catNotes.findIndex(n=>n.id===id);
        if (idx>=0){ catNotes.splice(idx,1);
            // recalc noteCount (using helper)
            data.targets[selectedTarget].noteCount = computeNoteCount(data.targets[selectedTarget].categories);
            save(); renderNotes(); renderTargets(); }
    }

    function startEditing(id){
        const note = findNoteById(id);
        if (!note) return;
        editingNoteId = id;
        noteContent.value = note.content || '';
        addNoteBtn.textContent = Lkey('save');
        clearNoteBtn.textContent = Lkey('cancel');
        noteContent.focus();
        // scroll to editor
        noteContent.scrollIntoView({behavior:'smooth', block:'center'});
    }

    function findNoteById(id){
        const cats = data.targets[selectedTarget].categories || {};
        for (const c in cats){
            const val = cats[c];
            if (Array.isArray(val)){
                const note = val.find(n=>n.id===id);
                if (note) return note;
            } else if (val && typeof val === 'object'){
                if (val._notes){ const note = val._notes.find(n=>n.id===id); if (note) return note; }
                if (val.sub){ for (const s in val.sub){ const note = val.sub[s].find(n=>n.id===id); if (note) return note; } }
            }
        }
        return null;
    }

                    if (langBtn){ langBtn.textContent = langFlags[next] || next; langBtn.title = (next==='pt'? langs.pt.langPtLabel : langs.en.langEnLabel); }
                    langMenu.classList.add('hidden');
                    if (langBtn) langBtn.setAttribute('aria-expanded','false');
                    langMenu.setAttribute('aria-hidden','true');
                });
            });
        }
        // click outside closes menu
        document.addEventListener('click', ()=>{ if (langMenu) { langMenu.classList.add('hidden'); if (langBtn) langBtn.setAttribute('aria-expanded','false'); langMenu.setAttribute('aria-hidden','true'); } });
    })();
    // import handlers
    const importFileInput = document.getElementById('importFileInput');
    const importBtn = document.getElementById('importBtn');
    if (importBtn && importFileInput){
        importBtn.addEventListener('click', ()=> importFileInput.click());
        importFileInput.addEventListener('change', handleImportFile);
    }

    function handleImportFile(e){
        const f = (e.target && e.target.files && e.target.files[0]) || null;
        if (!f) return;
        const reader = new FileReader();
        reader.onload = function(){
            try{
                    const parsed = JSON.parse(String(reader.result));
                    importData(parsed);
                }catch(err){
                    showToast(t('invalidFile',{err: (err && err.message ? err.message : err)}), {error:true, timeout:6000});
                }
        };
        reader.onerror = function(){ showToast(t('readFileError'), {error:true}); };
        reader.readAsText(f);
        importFileInput.value = '';
    }

    function importData(parsed){
        if (!parsed || typeof parsed !== 'object' || !parsed.targets || typeof parsed.targets !== 'object'){
            return showToast(t('invalidFormat'), {error:true});
        }
        // importar sem pedir confirmação: mesclar por padrão
        mergeImported(parsed);
        save(); renderTargets(); renderTargetDetails();
    }

    function mergeImported(parsed){
        const srcTargets = parsed.targets || {};
        Object.keys(srcTargets).forEach(tname => {
            const src = srcTargets[tname] || {};
            if (!data.targets[tname]){
                // clone source target safely
                data.targets[tname] = { categories: {}, noteCount: 0 };
            }
            const dst = data.targets[tname];
            const srcCats = src.categories || {};
            Object.keys(srcCats).forEach(cat => {
                const srcVal = srcCats[cat];
                // ensure dst category exists
                if (!dst.categories[cat]){
                    // deep clone
                    dst.categories[cat] = JSON.parse(JSON.stringify(srcVal));
                    return;
                }
                const dstVal = dst.categories[cat];
                // if both arrays -> append
                if (Array.isArray(dstVal) && Array.isArray(srcVal)){
                    srcVal.forEach(it=>dstVal.push(it));
                } else if (Array.isArray(dstVal) && srcVal && typeof srcVal === 'object'){
                    // convert dst to object to hold _notes + sub
                    dst.categories[cat] = { _notes: dstVal.slice(), sub: {} };
                    // merge srcVal into new structure
                    if (Array.isArray(srcVal._notes)) srcVal._notes.forEach(it=>dst.categories[cat]._notes.push(it));
                    if (srcVal.sub){ Object.keys(srcVal.sub).forEach(s=>{ dst.categories[cat].sub[s] = (dst.categories[cat].sub[s]||[]).concat(srcVal.sub[s]||[]); }); }
                } else if (dstVal && typeof dstVal === 'object' && Array.isArray(srcVal)){
                    // dst is object, src is array -> append into _notes
                    dstVal._notes = dstVal._notes || [];
                    srcVal.forEach(it=>dstVal._notes.push(it));
                } else if (dstVal && typeof dstVal === 'object' && srcVal && typeof srcVal === 'object'){
                    // both objects -> merge _notes and sub
                    dstVal._notes = dstVal._notes || [];
                    if (Array.isArray(srcVal._notes)) srcVal._notes.forEach(it=>dstVal._notes.push(it));
                    dstVal.sub = dstVal.sub || {};
                    if (srcVal.sub){ Object.keys(srcVal.sub).forEach(s=>{ dstVal.sub[s] = (dstVal.sub[s]||[]).concat(srcVal.sub[s]||[]); }); }
                }
            });
            // recalc noteCount for imported target (using helper)
            dst.noteCount = computeNoteCount(dst.categories);
        });
    }

    // init
    load();
    renderTargets();
    if (!selectedTarget){
        const keys = Object.keys(data.targets);
        if (keys.length) { selectedTarget = keys[0]; selectedCategory = Object.keys(data.targets[selectedTarget].categories||{})[0] || null; selectedSubcategory = null; }
    }
    renderTargetDetails();

    // keyboard shortcuts
    document.addEventListener('keydown',(e)=>{
        if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'n'){
            e.preventDefault(); newTargetInput.focus();
            return;
        }
        // Ctrl+S / Cmd+S -> save current note (if editor focused)
        if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's'){
            if (document.activeElement === noteContent){ e.preventDefault(); setSaveStatus(Lkey('saving')); addNote(); setTimeout(()=> setSaveStatus(Lkey('saved')), 300); }
        }
    });

    // expose for debugging (optional)
    window._BB = { data, save };
})();
</script>
</body>
</html>
